<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reid Radio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            padding: 3rem 1rem;
            color: white;
        }
        h1 {
            font-size: 3.5rem;
            margin: 10px 0;
        }
        .tagline {
            font-size: 1.4rem;
            opacity: 0.9;
        }
        .logo-video {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 8px solid #60a5fa;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .content {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        video.main {
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Reid Radio</h1>
        <p class="tagline">Faith • Family • Community</p>

        <!-- Your rotating logo video -->
        <video class="logo-video" autoplay loop muted playsinline>
            <source src="logo.mp4" type="video/mp4">
        </video>
    </header>

    <div class="content">
        <h2>Latest Video</h2>
        <video class="main" controls>
            <source src="intro-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <p>More shows and episodes coming soon...</p>
    </div>
</body>
</html>
