<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reid Radio</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* Full-screen background video */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Light gradient overlay between video and nav for readability */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(
                to bottom,
                rgba(15, 23, 42, 0.65) 0%,
                rgba(15, 23, 42, 0.25) 22%,
                rgba(15, 23, 42, 0) 50%
            );
            pointer-events: none;
        }

        /* Fixed top title bar — klove.com style */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.75rem;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(96, 165, 250, 0.35);
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f8fafc;
            text-decoration: none;
        }
        .brand span {
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.75rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-links a:hover {
            color: #60a5fa;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;
            height: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        @media (max-width: 700px) {
            .hamburger {
                display: flex;
            }
            .nav-links {
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                width: min(70vw, 260px);
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
                padding: 5rem 1.75rem;
                background: rgba(15, 23, 42, 0.92);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border-left: 1px solid rgba(96, 165, 250, 0.35);
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }
            .nav-links.open {
                transform: translateX(0);
            }
            .nav-links a {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- Full-screen background video -->
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="intro-video.mp4" type="video/mp4">
    </video>

    <!-- Gradient overlay for nav readability -->
    <div class="overlay"></div>

    <!-- Fixed top title bar -->
    <nav class="navbar">
        <a class="brand" href="#home">Reid<span>Radio</span></a>

        <button class="hamburger" aria-label="Toggle menu" aria-expanded="false" onclick="toggleMenu(this)">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="#home">Home</a></li>
            <li><a href="#shows">Shows</a></li>
            <li><a href="#music">Music</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <script>
        function toggleMenu(btn) {
            var links = document.getElementById('navLinks');
            var open = links.classList.toggle('open');
            btn.setAttribute('aria-expanded', open);
        }
        // Close the menu when a link is tapped (mobile)
        document.querySelectorAll('#navLinks a').forEach(function (a) {
            a.addEventListener('click', function () {
                var links = document.getElementById('navLinks');
                links.classList.remove('open');
                document.querySelector('.hamburger').setAttribute('aria-expanded', 'false');
            });
        });
    </script>
</body>
</html>
